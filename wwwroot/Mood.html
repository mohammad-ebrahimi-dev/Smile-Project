<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>حال من | Smile</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        /* ===== ریست و پایه ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', 'Inter', sans-serif;
            background: #cfebdd;
            min-height: 100vh;
            position: relative;
            padding: 20px;
            transition: background 0.3s ease, color 0.3s ease;
        }

            body::before {
                content: '';
                position: absolute;
                width: 320px;
                height: 320px;
                border-radius: 62% 38% 70% 30% / 42% 45% 55% 58%;
                background: rgba(70, 130, 100, 0.10);
                bottom: 20px;
                left: 20px;
                filter: blur(60px);
                z-index: 0;
                transition: background 0.3s ease;
            }

            body::after {
                content: '';
                position: absolute;
                width: 400px;
                height: 400px;
                border-radius: 53% 47% 63% 37% / 48% 55% 45% 52%;
                background: rgba(40, 100, 70, 0.06);
                top: -80px;
                right: -80px;
                filter: blur(70px);
                z-index: 0;
                transition: background 0.3s ease;
            }

            /* ===== حالت تاریک ===== */
            body.dark-mode {
                background: #1a2a22;
                color: #e0f0e8;
            }

                body.dark-mode::before,
                body.dark-mode::after {
                    background: rgba(200, 230, 210, 0.05);
                }

                body.dark-mode .smile-header,
                body.dark-mode .mood-card,
                body.dark-mode .mood-item,
                body.dark-mode .response-message,
                body.dark-mode .reset-btn,
                body.dark-mode .smile-input {
                    background: #243b30;
                    box-shadow: 9px 9px 16px #0f1f18, -9px -9px 16px #395748;
                }

                    body.dark-mode .mood-item.selected {
                        background: rgba(232, 168, 124, 0.15);
                        border-color: #e8a87c;
                    }

                body.dark-mode .smile-header {
                    box-shadow: 9px 9px 16px #0f1f18, -9px -9px 16px #395748;
                }

                body.dark-mode .logo-smile,
                body.dark-mode .mood-title,
                body.dark-mode .mood-item .mood-label,
                body.dark-mode .response-message .msg-title,
                body.dark-mode .response-message .msg-text,
                body.dark-mode .poem-content,
                body.dark-mode .reset-btn {
                    color: #e0f0e8;
                }

                body.dark-mode .nav-links a {
                    color: #b0d0c0;
                }

                    body.dark-mode .nav-links a.active {
                        color: #e8a87c;
                        background: rgba(232, 168, 124, 0.08);
                    }

                body.dark-mode .mood-subtitle,
                body.dark-mode .mood-item .mood-badge,
                body.dark-mode .response-message .msg-footer,
                body.dark-mode .footer-note,
                body.dark-mode .message-area .empty-state,
                body.dark-mode .poem-section .poem-label {
                    color: #9abbab;
                }

                body.dark-mode .wave-line {
                    background: linear-gradient(90deg, #5fbb9b, #e8a87c, #5fbb9b);
                }

                body.dark-mode .poem-content {
                    background: rgba(232, 168, 124, 0.08);
                    border-right-color: #e8a87c;
                }

        /* ===== هدر ===== */
        .smile-header {
            position: fixed;
            top: 25px;
            right: 25px;
            left: 25px;
            background: #cfebdd;
            border-radius: 80px;
            padding: 12px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 9px 9px 16px #b8cfc3, -9px -9px 16px #e6fff0;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .logo-smile {
            font-size: 1.8rem;
            font-weight: 800;
            color: #2c5a44;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s ease;
        }

            .logo-smile i {
                color: #e8a87c;
                text-shadow: 2px 2px 4px #b8cfc3, -1px -1px 2px white;
            }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

            .nav-links a {
                text-decoration: none;
                color: #2c5a44;
                font-weight: 600;
                font-size: 1rem;
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 14px;
                border-radius: 50px;
                transition: all 0.25s;
                background: transparent;
            }

                .nav-links a:hover {
                    box-shadow: inset 4px 4px 8px #b8cfc3, inset -4px -4px 8px #e6fff0;
                    color: #1d3e2f;
                }

                .nav-links a.active {
                    box-shadow: inset 4px 4px 8px #b8cfc3, inset -4px -4px 8px #e6fff0;
                    color: #1d3e2f;
                    background: rgba(232, 168, 124, 0.08);
                }

        /* دکمه تغییر تم */
        .theme-toggle {
            background: transparent;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 40px;
            transition: all 0.25s;
            color: #2c5a44;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(232, 168, 124, 0.1);
            box-shadow: inset 2px 2px 6px #b8cfc3, inset -2px -2px 6px #e6fff0;
        }

            .theme-toggle:hover {
                transform: scale(1.05);
            }

            .theme-toggle:active {
                transform: scale(0.95);
            }

        body.dark-mode .theme-toggle {
            color: #e8a87c;
            background: rgba(232, 168, 124, 0.15);
            box-shadow: inset 2px 2px 6px #0f1f18, inset -2px -2px 6px #395748;
        }

        /* ===== کانتینر اصلی ===== */
        .mood-container {
            max-width: 1000px;
            margin: 120px auto 60px;
            position: relative;
            z-index: 2;
            padding: 0 20px;
        }

        /* ===== کارت اصلی ===== */
        .mood-card {
            background: #cfebdd;
            border-radius: 64px;
            padding: 48px 38px;
            box-shadow: 20px 20px 35px #b0c7b9, -20px -20px 35px #eefff1;
            animation: softRise 0.55s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        @keyframes softRise {
            0% {
                opacity: 0;
                transform: translateY(35px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .mood-header {
            text-align: center;
            margin-bottom: 20px;
        }

            .mood-header .big-icon {
                font-size: 3.8rem;
                color: #e8a87c;
                filter: drop-shadow(2px 2px 6px #b8cfc3);
                animation: float 3s ease-in-out infinite;
                display: inline-block;
            }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .mood-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #1f4d38;
            margin-top: 8px;
            transition: color 0.3s ease;
        }

        .mood-subtitle {
            color: #4b6e5b;
            font-size: 0.95rem;
            font-weight: 500;
            margin-top: 4px;
            transition: color 0.3s ease;
        }

        .wave-line {
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, #2c5a44, #e8a87c, #5fbb9b);
            margin: 16px auto 30px;
            border-radius: 4px;
            transition: background 0.3s ease;
        }

        /* ===== شبکه گزینه‌های حال ===== */
        .mood-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin: 30px 0 40px;
        }

        .mood-item {
            background: #cfebdd;
            border-radius: 40px;
            padding: 28px 18px 24px;
            box-shadow: 9px 9px 16px #b0c7b9, -9px -9px 16px #eefff1;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            border: none;
            font-family: 'Vazirmatn', 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            position: relative;
        }

            .mood-item:hover {
                transform: translateY(-6px);
                box-shadow: 14px 14px 24px #b0c7b9, -14px -14px 24px #eefff1;
            }

            .mood-item:active {
                transform: scale(0.97);
                box-shadow: inset 6px 6px 12px #b0c7b9, inset -6px -6px 12px #eefff1;
            }

            .mood-item.selected {
                box-shadow: inset 6px 6px 12px #b0c7b9, inset -6px -6px 12px #eefff1;
                background: rgba(232, 168, 124, 0.12);
                border: 2px solid #e8a87c;
                transform: scale(0.98);
            }

            .mood-item .mood-emoji {
                font-size: 2.8rem;
                line-height: 1;
            }

            .mood-item .mood-label {
                font-size: 1rem;
                font-weight: 700;
                color: #1f4d38;
                line-height: 1.5;
                transition: color 0.3s ease;
            }

            .mood-item .mood-badge {
                font-size: 0.7rem;
                font-weight: 600;
                color: #799b89;
                background: rgba(44, 90, 68, 0.06);
                padding: 2px 14px;
                border-radius: 60px;
                margin-top: 2px;
                transition: color 0.3s ease;
            }

        /* ===== پیام پاسخ ===== */
        .message-area {
            margin-top: 30px;
            padding-top: 28px;
            border-top: 2px solid rgba(46, 90, 67, 0.15);
            min-height: 100px;
            transition: all 0.3s ease;
        }

            .message-area .empty-state {
                text-align: center;
                color: #799b89;
                font-weight: 400;
                font-size: 0.9rem;
                padding: 20px 0;
                transition: color 0.3s ease;
            }

                .message-area .empty-state i {
                    font-size: 2rem;
                    color: #e8a87c;
                    display: block;
                    margin-bottom: 10px;
                    opacity: 0.6;
                }

        .response-message {
            background: #cfebdd;
            border-radius: 40px;
            padding: 32px 34px;
            box-shadow: inset 5px 5px 14px #b0c7b9, inset -5px -5px 14px #eefff1;
            animation: fadeSlideUp 0.45s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            text-align: center;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        @keyframes fadeSlideUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .response-message .msg-emoji {
            font-size: 2.6rem;
            margin-bottom: 8px;
            display: block;
        }

        .response-message .msg-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #1f4d38;
            margin-bottom: 8px;
            transition: color 0.3s ease;
        }

        .response-message .msg-text {
            font-size: 1rem;
            line-height: 1.9;
            color: #2c5a44;
            font-weight: 400;
            max-width: 600px;
            margin: 0 auto;
            transition: color 0.3s ease;
        }

        /* ===== بخش شعر ===== */
        .poem-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(46, 90, 67, 0.12);
        }

            .poem-section .poem-label {
                font-size: 0.8rem;
                color: #799b89;
                font-weight: 500;
                margin-bottom: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                transition: color 0.3s ease;
            }

                .poem-section .poem-label i {
                    color: #e8a87c;
                }

        .poem-content {
            font-family: 'Vazirmatn', 'Inter', sans-serif;
            font-size: 0.95rem;
            line-height: 2.2;
            color: #1f4d38;
            font-weight: 500;
            white-space: pre-line;
            text-align: center;
            max-width: 500px;
            margin: 0 auto;
            padding: 12px 20px;
            background: rgba(232, 168, 124, 0.06);
            border-radius: 32px;
            border-right: 3px solid #e8a87c;
            transition: all 0.3s ease;
        }

            .poem-content .poem-verse {
                display: block;
            }

                .poem-content .poem-verse:not(:last-child) {
                    margin-bottom: 4px;
                }

        .response-message .msg-footer {
            margin-top: 16px;
            font-size: 0.8rem;
            color: #799b89;
            border-top: 1px solid rgba(46, 90, 67, 0.08);
            padding-top: 14px;
            transition: color 0.3s ease;
        }

        /* ===== دکمه تغییر ===== */
        .reset-btn {
            background: #cfebdd;
            border: none;
            padding: 12px 30px;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #1f4d38;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 18px;
            box-shadow: 6px 6px 12px #b0c7b9, -6px -6px 12px #eefff1;
            transition: all 0.2s;
            font-family: 'Vazirmatn', 'Inter', sans-serif;
        }

            .reset-btn:hover {
                transform: translateY(-2px);
                box-shadow: 10px 10px 18px #b0c7b9, -10px -10px 18px #eefff1;
                color: #e8a87c;
            }

            .reset-btn:active {
                transform: scale(0.97);
                box-shadow: inset 4px 4px 8px #b0c7b9, inset -4px -4px 8px #eefff1;
            }

            .reset-btn i {
                color: #e8a87c;
            }

        /* ===== فوتر ===== */
        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: #799b89;
            margin-top: 30px;
            font-weight: 400;
            transition: color 0.3s ease;
        }

        /* ===== ریسپانسیو موبایل ===== */
        @media (max-width: 820px) {
            .smile-header {
                top: 15px;
                right: 15px;
                left: 15px;
                padding: 8px 16px;
                border-radius: 60px;
            }

            .logo-smile {
                font-size: 1.3rem;
                gap: 4px;
            }

                .logo-smile i {
                    font-size: 1.2rem;
                }

            .nav-links {
                gap: 8px;
            }

                .nav-links a {
                    font-size: 0.8rem;
                    padding: 6px 10px;
                    gap: 4px;
                }

                    .nav-links a span {
                        display: none;
                    }

                    .nav-links a i {
                        font-size: 1.2rem;
                    }

            .theme-toggle {
                font-size: 1.1rem;
                padding: 4px 8px;
                margin-right: 4px;
            }

            .mood-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 18px;
            }

            .mood-card {
                padding: 32px 20px;
                border-radius: 40px;
            }

            .mood-title {
                font-size: 1.8rem;
            }

            .mood-header .big-icon {
                font-size: 2.8rem;
            }
        }

        @media (max-width: 500px) {
            .smile-header {
                padding: 6px 12px;
                border-radius: 40px;
                top: 10px;
                right: 10px;
                left: 10px;
            }

            .logo-smile {
                font-size: 1rem;
            }

                .logo-smile i {
                    font-size: 1rem;
                }

            .nav-links a {
                padding: 4px 8px;
                font-size: 0.7rem;
            }

                .nav-links a i {
                    font-size: 1rem;
                }

            .theme-toggle {
                font-size: 0.9rem;
                padding: 3px 6px;
            }

            .mood-grid {
                grid-template-columns: 1fr 1fr;
                gap: 14px;
            }

            .mood-item {
                padding: 20px 12px 16px;
            }

                .mood-item .mood-emoji {
                    font-size: 2.2rem;
                }

                .mood-item .mood-label {
                    font-size: 0.85rem;
                }

            .response-message {
                padding: 24px 18px;
            }

                .response-message .msg-title {
                    font-size: 1.2rem;
                }

            .mood-title {
                font-size: 1.5rem;
            }

            .mood-header .big-icon {
                font-size: 2.8rem;
            }

            .poem-content {
                font-size: 0.85rem;
                padding: 10px 14px;
            }

            .reset-btn {
                padding: 10px 22px;
                font-size: 0.8rem;
            }
        }

        @media (max-width: 380px) {
            .mood-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .nav-links {
                gap: 4px;
            }

                .nav-links a {
                    padding: 4px 6px;
                }
        }
    </style>
</head>
<body>

    <!-- ===== هدر ===== -->
    <div class="smile-header">
        <div class="logo-smile">
            <i class="fas fa-smile-beam"></i>
            <span>Smile</span>
        </div>
        <div class="nav-links">
            <a href="index.html" id="navHome"><i class="fas fa-house-chimney"></i> <span>خانه</span></a>
            <a href="Login.html" id="navLogin"><i class="fas fa-user-plus"></i> <span>ثبت نام</span></a>
            <a href="Dashboard.html" id="navDashboard"><i class="fas fa-square-poll-vertical"></i> <span>داشبورد</span></a>
            <a href="Mood.html" id="navMood" class="active"><i class="fas fa-heart"></i> <span>حال من</span></a>
            <a href="AboutUs.html" id="navAbout"><i class="fas fa-handshake"></i> <span>درباره ما</span></a>
            <a href="ContactUs.html" id="navContact"><i class="fas fa-inbox"></i> <span>ارتباط با ما</span></a>
            <button class="theme-toggle" id="themeToggle" aria-label="تغییر تم">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </div>

    <!-- ===== محتوای اصلی ===== -->
    <div class="mood-container">
        <div class="mood-card">

            <!-- هدر -->
            <div class="mood-header">
                <span class="big-icon">🌸</span>
                <div class="mood-title">حالت امروز چطوره؟</div>
                <div class="mood-subtitle">
                    یکی از گزینه‌ها رو انتخاب کن تا یه پیام مخصوص خودت دریافت کنی
                </div>
                <div class="wave-line"></div>
            </div>

            <!-- شبکه حالات -->
            <div class="mood-grid" id="moodGrid">
                <!-- گزینه‌ها با جاوااسکریپت ساخته می‌شن -->
            </div>

            <!-- منطقه پیام -->
            <div class="message-area" id="messageArea">
                <div class="empty-state" id="emptyState">
                    <i class="fas fa-comment-dots"></i>
                    هنوز گزینه‌ای انتخاب نکردی …<br />
                    <span style="font-size:0.8rem; color:#9bb7a7;">روی یکی از کارت‌های بالا بزن تا پیام‌ات رو ببینی</span>
                </div>
                <div id="responseContainer" style="display:none;"></div>
            </div>

            <!-- دکمه تغییر انتخاب -->
            <div style="text-align:center; margin-top:10px;">
                <button class="reset-btn" id="resetBtn" style="display:none;">
                    <i class="fas fa-undo-alt"></i> انتخاب مجدد
                </button>
            </div>

        </div>

        <div class="footer-note">
            <i class="fas fa-heart" style="color:#e8a87c;"></i>
            هر روز یه پیام تازه، متناسب با حالت امروز
        </div>
    </div>

    <script>
        // ============================================================
        //  داده‌های حالات با پیام‌ها و اشعار مخصوص هر حالت
        // ============================================================
        const MOODS = [{
            id: 1,
            emoji: '🌙',
            label: 'کاش الان کنارم بود',
            badge: 'دلتنگ',
            messages: [{
                title: 'دلتنگ نباش 🌷',
                text: 'دوست عزیز، می‌دانم که دلت برای کسی تنگ شده. وجود تو ارزشمند است و کسانی که دوستت دارند، همیشه در قلب تو هستند. لبخند بزن، چون تو زیبایی و دوست‌داشتنی.'
            }, {
                title: 'تو تنها نیستی 🤗',
                text: 'احساس دلتنگی نشانه‌ی عشق و محبت توست. بدان که کسی در دوردست‌ها به تو فکر می‌کند. امروز به خودت یه دلخوشی کوچک بده و صبور باش، روزهای قشنگ در راه‌اند.'
            }, {
                title: 'قلب تو جای امنی است 💖',
                text: 'اگر کسی کنارت نیست، خودت کنار خودت باش. تو می‌توانی منبع آرامش خودت باشی. نفس عمیق بکش و به خاطرات خوب فکر کن. همه‌ی ما گاهی دلتنگ می‌شویم، این زیبایی انسان بودن است.'
            }],
            poems: [
                `من چرا دل به تو دادم که دلم می‌شکنی
یا چه کردم که نگه باز به من می‌نکنی

دل و جانم به تو مشغول و نظر در چپ و راست
تا ندانند حریفان که تو منظور منی`,

                `درد عشقی کشیدن که مپرس
زهر هجری کشیده‌ام که مپرس
گشته‌ام در جهان و آخر کار
دلبری برگزیده‌ام که مپرس`
            ]

        // ============================================================
        //  رفرنس‌ها
        // ============================================================
        const grid = document.getElementById('moodGrid');
        const messageArea = document.getElementById('messageArea');
        const emptyState = document.getElementById('emptyState');
        const responseContainer = document.getElementById('responseContainer');
        const resetBtn = document.getElementById('resetBtn');
        const themeToggle = document.getElementById('themeToggle');

        // ============================================================
        //  نگهداری آخرین اندیس برای پیام‌ها و اشعار (جداگانه)
        // ============================================================
        const lastMsgIndexMap = {};
        const lastPoemIndexMap = {};

        // ============================================================
        //  توابع انتخاب غیر تکراری (چرخشی)
        // ============================================================
        function getNextIndex(lastMap, id, items) {
            const count = items.length;
            if (count === 1) return 0;

            const lastIdx = lastMap[id] ?? -1;
            const available = [];
            for (let i = 0; i < count; i++) {
                if (i !== lastIdx) available.push(i);
            }
            if (available.length === 0) return 0;

            const randomIdx = available[Math.floor(Math.random() * available.length)];
            lastMap[id] = randomIdx;
            return randomIdx;
        }

        // ============================================================
        //  ساخت کارت‌های حال
        // ============================================================
        function buildMoodCards() {
            grid.innerHTML = '';
            MOODS.forEach(m => {
                const div = document.createElement('div');
                div.className = 'mood-item';
                div.dataset.id = m.id;
                div.innerHTML = `
                                <span class="mood-emoji">${m.emoji}</span>
                                <span class="mood-label">${m.label}</span>
                                <span class="mood-badge">${m.badge}</span>
                            `;
                div.addEventListener('click', () => handleMoodSelect(m.id));
                grid.appendChild(div);
            });
        }

        // ============================================================
        //  انتخاب حالت و نمایش پیام + شعر
        // ============================================================
        function handleMoodSelect(id) {
            document.querySelectorAll('.mood-item').forEach(el => el.classList.remove('selected'));

            const target = document.querySelector(`.mood-item[data-id="${id}"]`);
            if (target) target.classList.add('selected');

            const mood = MOODS.find(m => m.id === id);
            if (!mood) return;

            const msgIndex = getNextIndex(lastMsgIndexMap, id, mood.messages);
            const message = mood.messages[msgIndex];

            const poemIndex = getNextIndex(lastPoemIndexMap, id, mood.poems);
            const poem = mood.poems[poemIndex];

            showMessageAndPoem(mood, message, poem);

            resetBtn.style.display = 'inline-flex';

            setTimeout(() => {
                messageArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 200);
        }

        // ============================================================
        //  نمایش پیام و شعر
        // ============================================================
        function showMessageAndPoem(mood, message, poem) {
            emptyState.style.display = 'none';
            responseContainer.style.display = 'block';

            const poemLines = poem.split('\n').filter(line => line.trim() !== '');
            const poemHtml = poemLines.map(line =>
                `<span class="poem-verse">${line}</span>`
            ).join('');

            responseContainer.innerHTML = `
                            <div class="response-message">
                                <span class="msg-emoji">${mood.emoji}</span>
                                <div class="msg-title">${message.title}</div>
                                <div class="msg-text">${message.text}</div>

                                <div class="poem-section">
                                    <div class="poem-label">
                                        <i class="fas fa-feather-alt"></i>
                                        شعری برای حال تو
                                        <i class="fas fa-feather-alt"></i>
                                    </div>
                                    <div class="poem-content">
                                        ${poemHtml}
                                    </div>
                                </div>

                                <div class="msg-footer">
                                    <i class="fas fa-smile-beam" style="color:#e8a87c;"></i>
                                    این پیام و شعر مخصوص توست، امیدوارم حالت رو بهتر کنه
                                </div>
                            </div>
                        `;
        }

        // ============================================================
        //  ریست / انتخاب مجدد
        // ============================================================
        function resetSelection() {
            document.querySelectorAll('.mood-item').forEach(el => el.classList.remove('selected'));
            responseContainer.style.display = 'none';
            emptyState.style.display = 'block';
            resetBtn.style.display = 'none';
            grid.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // ============================================================
        //  تغییر تم (روشن/تاریک)
        // ============================================================
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            themeToggle.innerHTML = isDark ?
                '<i class="fas fa-sun"></i>' :
                '<i class="fas fa-moon"></i>';
            // ذخیره در localStorage
            localStorage.setItem('smile-theme', isDark ? 'dark' : 'light');
        }

        // ============================================================
        //  بارگذاری تم ذخیره شده
        // ============================================================
        function loadTheme() {
            const saved = localStorage.getItem('smile-theme');
            if (saved === 'dark') {
                document.body.classList.add('dark-mode');
                themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
            }
        }

        // ============================================================
        //  منوی فعال
        // ============================================================
        function setActiveNavItem() {
            document.querySelectorAll('.nav-links a').forEach(el => el.classList.remove('active'));
            const navMood = document.getElementById('navMood');
            if (navMood) navMood.classList.add('active');
        }

        // ============================================================
        //  راه‌اندازی
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            loadTheme();
            setActiveNavItem();
            buildMoodCards();

            resetBtn.addEventListener('click', resetSelection);
            themeToggle.addEventListener('click', toggleTheme);
        });
    </script>
