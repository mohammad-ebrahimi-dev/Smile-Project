<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>حال تو  | Smile</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        /* ===== ریست و پایه ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', 'Inter', sans-serif;
            background: #cfebdd;
            min-height: 100vh;
            position: relative;
            padding: 20px;
        }

        body::before {
            content: '';
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 62% 38% 70% 30% / 42% 45% 55% 58%;
            background: rgba(70, 130, 100, 0.10);
            bottom: 20px;
            left: 20px;
            filter: blur(60px);
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 53% 47% 63% 37% / 48% 55% 45% 52%;
            background: rgba(40, 100, 70, 0.06);
            top: -80px;
            right: -80px;
            filter: blur(70px);
            z-index: 0;
        }

        /* ===== هدر ===== */
        .smile-header {
            position: fixed;
            top: 25px;
            right: 25px;
            left: 25px;
            background: #cfebdd;
            border-radius: 80px;
            padding: 12px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 9px 9px 16px #b8cfc3, -9px -9px 16px #e6fff0;
            z-index: 100;
            transition: all 0.2s ease;
        }

        .logo-smile {
            font-size: 1.8rem;
            font-weight: 800;
            color: #2c5a44;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-smile i {
            color: #e8a87c;
            text-shadow: 2px 2px 4px #b8cfc3, -1px -1px 2px white;
        }

        .nav-links {
            display: flex;
            gap: 36px;
        }

        .nav-links a {
            text-decoration: none;
            color: #2c5a44;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 50px;
            transition: all 0.25s;
            background: transparent;
        }

        .nav-links a:hover {
            box-shadow: inset 4px 4px 8px #b8cfc3, inset -4px -4px 8px #e6fff0;
            color: #1d3e2f;
        }

        .nav-links a.active {
            box-shadow: inset 4px 4px 8px #b8cfc3, inset -4px -4px 8px #e6fff0;
            color: #1d3e2f;
            background: rgba(232, 168, 124, 0.08);
        }

        /* ===== کانتینر اصلی ===== */
        .mood-container {
            max-width: 1000px;
            margin: 120px auto 60px;
            position: relative;
            z-index: 2;
            padding: 0 20px;
        }

        /* ===== کارت اصلی ===== */
        .mood-card {
            background: #cfebdd;
            border-radius: 64px;
            padding: 48px 38px;
            box-shadow: 20px 20px 35px #b0c7b9, -20px -20px 35px #eefff1;
            animation: softRise 0.55s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        @keyframes softRise {
            0% {
                opacity: 0;
                transform: translateY(35px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .mood-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .mood-header .big-icon {
            font-size: 3.8rem;
            color: #e8a87c;
            filter: drop-shadow(2px 2px 6px #b8cfc3);
            animation: float 3s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .mood-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #1f4d38;
            margin-top: 8px;
        }

        .mood-subtitle {
            color: #4b6e5b;
            font-size: 0.95rem;
            font-weight: 500;
            margin-top: 4px;
        }

        .wave-line {
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, #2c5a44, #e8a87c, #5fbb9b);
            margin: 16px auto 30px;
            border-radius: 4px;
        }

        /* ===== شبکه گزینه‌های حال ===== */
        .mood-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin: 30px 0 40px;
        }

        .mood-item {
            background: #cfebdd;
            border-radius: 40px;
            padding: 28px 18px 24px;
            box-shadow: 9px 9px 16px #b0c7b9, -9px -9px 16px #eefff1;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            border: none;
            font-family: 'Vazirmatn', 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .mood-item:hover {
            transform: translateY(-6px);
            box-shadow: 14px 14px 24px #b0c7b9, -14px -14px 24px #eefff1;
        }

        .mood-item:active {
            transform: scale(0.97);
            box-shadow: inset 6px 6px 12px #b0c7b9, inset -6px -6px 12px #eefff1;
        }

        .mood-item.selected {
            box-shadow: inset 6px 6px 12px #b0c7b9, inset -6px -6px 12px #eefff1;
            background: rgba(232, 168, 124, 0.12);
            border: 2px solid #e8a87c;
            transform: scale(0.98);
        }

        .mood-item .mood-emoji {
            font-size: 2.8rem;
            line-height: 1;
        }

        .mood-item .mood-label {
            font-size: 1rem;
            font-weight: 700;
            color: #1f4d38;
            line-height: 1.5;
        }

        .mood-item .mood-badge {
            font-size: 0.7rem;
            font-weight: 600;
            color: #799b89;
            background: rgba(44, 90, 68, 0.06);
            padding: 2px 14px;
            border-radius: 60px;
            margin-top: 2px;
        }

        /* ===== پیام پاسخ ===== */
        .message-area {
            margin-top: 30px;
            padding-top: 28px;
            border-top: 2px solid rgba(46, 90, 67, 0.15);
            min-height: 100px;
            transition: all 0.3s ease;
        }

        .message-area .empty-state {
            text-align: center;
            color: #799b89;
            font-weight: 400;
            font-size: 0.9rem;
            padding: 20px 0;
        }

        .message-area .empty-state i {
            font-size: 2rem;
            color: #e8a87c;
            display: block;
            margin-bottom: 10px;
            opacity: 0.6;
        }

        .response-message {
            background: #cfebdd;
            border-radius: 40px;
            padding: 32px 34px;
            box-shadow: inset 5px 5px 14px #b0c7b9, inset -5px -5px 14px #eefff1;
            animation: fadeSlideUp 0.45s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            text-align: center;
        }

        @keyframes fadeSlideUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .response-message .msg-emoji {
            font-size: 2.6rem;
            margin-bottom: 8px;
            display: block;
        }

        .response-message .msg-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #1f4d38;
            margin-bottom: 8px;
        }

        .response-message .msg-text {
            font-size: 1rem;
            line-height: 1.9;
            color: #2c5a44;
            font-weight: 400;
            max-width: 600px;
            margin: 0 auto;
        }

        /* ===== بخش شعر ===== */
        .poem-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(46, 90, 67, 0.12);
        }

        .poem-section .poem-label {
            font-size: 0.8rem;
            color: #799b89;
            font-weight: 500;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .poem-section .poem-label i {
            color: #e8a87c;
        }

        .poem-content {
            font-family: 'Vazirmatn', 'Inter', sans-serif;
            font-size: 0.95rem;
            line-height: 2.2;
            color: #1f4d38;
            font-weight: 500;
            white-space: pre-line;
            text-align: center;
            max-width: 500px;
            margin: 0 auto;
            padding: 12px 20px;
            background: rgba(232, 168, 124, 0.06);
            border-radius: 32px;
            border-right: 3px solid #e8a87c;
        }

        .poem-content .poem-verse {
            display: block;
        }

        .poem-content .poem-verse:not(:last-child) {
            margin-bottom: 4px;
        }

        .response-message .msg-footer {
            margin-top: 16px;
            font-size: 0.8rem;
            color: #799b89;
            border-top: 1px solid rgba(46, 90, 67, 0.08);
            padding-top: 14px;
        }

        /* ===== دکمه تغییر ===== */
        .reset-btn {
            background: #cfebdd;
            border: none;
            padding: 12px 30px;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #1f4d38;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 18px;
            box-shadow: 6px 6px 12px #b0c7b9, -6px -6px 12px #eefff1;
            transition: all 0.2s;
            font-family: 'Vazirmatn', 'Inter', sans-serif;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 10px 10px 18px #b0c7b9, -10px -10px 18px #eefff1;
            color: #e8a87c;
        }

        .reset-btn:active {
            transform: scale(0.97);
            box-shadow: inset 4px 4px 8px #b0c7b9, inset -4px -4px 8px #eefff1;
        }

        .reset-btn i {
            color: #e8a87c;
        }

        /* ===== فوتر ===== */
        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: #799b89;
            margin-top: 30px;
            font-weight: 400;
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 820px) {
            .mood-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 18px;
            }

            .smile-header {
                top: 15px;
                right: 15px;
                left: 15px;
                padding: 10px 20px;
            }

            .nav-links {
                gap: 15px;
            }

            .nav-links a span {
                display: none;
            }

            .nav-links a i {
                font-size: 1.3rem;
            }

            .mood-card {
                padding: 32px 20px;
            }

            .mood-title {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 500px) {
            .mood-grid {
                grid-template-columns: 1fr 1fr;
                gap: 14px;
            }

            .mood-item {
                padding: 20px 12px 16px;
            }

            .mood-item .mood-emoji {
                font-size: 2.2rem;
            }

            .mood-item .mood-label {
                font-size: 0.85rem;
            }

            .response-message {
                padding: 24px 18px;
            }

            .response-message .msg-title {
                font-size: 1.2rem;
            }

            .mood-title {
                font-size: 1.5rem;
            }

            .mood-header .big-icon {
                font-size: 2.8rem;
            }

            .poem-content {
                font-size: 0.85rem;
                padding: 10px 14px;
            }
        }

        @media (max-width: 380px) {
            .mood-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== هدر ===== -->
    <div class="smile-header">
        <div class="logo-smile">
            <i class="fas fa-smile-beam"></i>
            <span>Smile</span>
        </div>
        <div class="nav-links">
            <a href="index.html" id="navHome"><i class="fas fa-house-chimney"></i> <span>خانه</span></a>
            <a href="Login.html" id="navLogin"><i class="fas fa-user-plus"></i> <span>ثبت نام</span></a>
            <a href="Dashboard.html" id="navDashboard"><i class="fas fa-square-poll-vertical"></i> <span>داشبورد</span></a>
            <a href="Mood.html" id="navMood" class="active"><i class="fas fa-heart"></i> <span>حال تو</span></a>
            <a href="AboutUs.html" id="navAbout"><i class="fas fa-handshake"></i> <span>درباره ما</span></a>
            <a href="ContactUs.html" id="navContact"><i class="fas fa-inbox"></i> <span>ارتباط با ما</span></a>
        </div>
    </div>

    <!-- ===== محتوای اصلی ===== -->
    <div class="mood-container">
        <div class="mood-card">

            <!-- هدر -->
            <div class="mood-header">
                <span class="big-icon">🌸</span>
                <div class="mood-title">حالت امروز چطوره؟</div>
                <div class="mood-subtitle">
                    یکی از گزینه‌ها رو انتخاب کن تا یه پیام مخصوص خودت دریافت کنی
                </div>
                <div class="wave-line"></div>
            </div>

            <!-- شبکه حالات -->
            <div class="mood-grid" id="moodGrid">
                <!-- گزینه‌ها با جاوااسکریپت ساخته می‌شن -->
            </div>

            <!-- منطقه پیام -->
            <div class="message-area" id="messageArea">
                <div class="empty-state" id="emptyState">
                    <i class="fas fa-comment-dots"></i>
                    هنوز گزینه‌ای انتخاب نکردی …<br />
                    <span style="font-size:0.8rem; color:#9bb7a7;">روی یکی از کارت‌های بالا بزن تا پیام‌ات رو ببینی</span>
                </div>
                <div id="responseContainer" style="display:none;"></div>
            </div>

            <!-- دکمه تغییر انتخاب -->
            <div style="text-align:center; margin-top:10px;">
                <button class="reset-btn" id="resetBtn" style="display:none;">
                    <i class="fas fa-undo-alt"></i> انتخاب مجدد
                </button>
            </div>

        </div>

        <div class="footer-note">
            <i class="fas fa-heart" style="color:#e8a87c;"></i>
            هر روز یه پیام تازه، متناسب با حالت امروز
        </div>
    </div>

    <script>
        // ============================================================
        //  داده‌های حالات با پیام‌ها و اشعار مخصوص هر حالت
        // ============================================================
        const MOODS = [{
            id: 1,
            emoji: '🌙',
            label: 'کاش الان کنارم بود',
            badge: 'دلتنگ',
            messages: [{
                title: 'دلتنگ نباش 🌷',
                text: 'دوست عزیز، می‌دونم که دلت برای کسی تنگ شده. وجود تو ارزشمنده و کسانی که دوست دارند، همیشه در قلب توئن. لبخند بزن، چون تو زیبایی و دوست‌داشتنی.'
            }, {
                title: 'تو تنها نیستی 🤗',
                text: 'احساس دلتنگی نشانه‌ی عشق و محبت توئه. بدون که کسی در دوردست‌ها به تو فکر می‌کنه. امروز به خودت یه دلخوشی کوچک بده و صبور باش، روزهای قشنگ تو راهن.'
            }, {
                title: 'قلب تو جای امنی است 💖',
                text: 'اگه کسی کنارت نیست، خودت کنار خودت باش. تو می‌تونی منبع آرامش خودت باشی. نفس عمیق بکش و به خاطرات خوب فکر کن. همه‌ی ما گاهی دلتنگ می‌شیم، این زیبایی انسان بودنه.'
            }],
            poems: [
                `من چرا دل به تو دادم که دلم می‌شکنی
یا چه کردم که نگه باز به من می‌نکنی

دل و جانم به تو مشغول و نظر در چپ و راست
تا ندانند حریفان که تو منظور منی`,

                `درد عشقی کشیدن که مپرس
زهر هجری کشیده‌ام که مپرس
گشته‌ام در جهان و آخر کار
دلبری برگزیده‌ام که مپرس`
            ]
        }, {
            id: 2,
            emoji: '🌧️',
            label: 'حس میکنم کسی دوسم نداره',
            badge: 'تنها',
            messages: [{
                title: 'تو دوست‌داشتنی‌ترینی 💛',
                text: 'عزیز دلم، گاهی ذهن ما به ما دروغ می‌گه. اما حقیقت اینه که تو ارزشمند و دوست‌داشتنی هستی. امروز روزیه که خودت رو بیشتر دوست داشته باشی. به آینه نگاه کن و به خودت بگو: «من عاشق خودم هستم».'
            }, {
                title: 'خودت را بغل کن 🫂',
                text: 'این احساس رو جدی نگیر. تو موجودی بی‌نظیر و دوست‌داشتنی هستی. ممکنه امروز کسی نباشه، اما خودت همیشه هستی. قدر خودت رو بدون و به کسانی که دوستت دارن، حتی اگر دور باشن، فکر کن.'
            }, {
                title: 'تو نوری در تاریکی ✨',
                text: 'حتی زمانی که فکر می‌کنی کسی دوستت نداره، بدون که تو نوری برای دنیایی . ارزش تو به عشق بقیه نیست، به وجود خودته. امروز روز خودشناسی و عشق به خودت باشه.'
            }],
            poems: [
                `سینه مالامال درد است ای دریغا مرهمی
دل ز تنهایی به جان آمد خدا را همدمی

چشم آسایش که دارد از سپهر تیزرو
ساقیا جامی به من ده تا بیاسایم دمی`,

                `زیرکی را گفتم این احوال بین خندید و گفت
صعب روزی بوالعجب کاری پریشان عالمی`,

                `سکوتت را ندانستم، نگاهم را نفهمیدی
نگفتم گفتنی‌ها را، تو هم هرگز نپرسیدی

شبی که شام آخر بود، به دست دوست خنجر بود
میان عشق و آینه یه جنگ نابرابر بود`,

                `ز بس خندیدم و پنهان نمودم راز خود را
کسی باور ندارد در دلم، دریای درد است`
            ]
        }, {
            id: 3,
            emoji: '🌞',
            label: 'خوشحالم و همه چی عالیه',
            badge: 'شاد',
            messages: [{
                title: 'چه روز قشنگی! 🌟',
                text: 'چه عالی! خوشحالی تو مسریه. این انرژی مثبت رو حفظ کن و به دیگران هم منتقل کن. امروز روز توئه . از هر لحظه‌اش لذت ببر و یادت باشه که شادی تو می‌تونه دنیای اطرافت را هم روشن کنه.'
            }, {
                title: 'بهترین حالت ممکن 😍',
                text: 'این حس خوب رو دقیقاً به خاطر بسپار. وقتی خوشحالی، همه چی زیباتر میشه. امروز هر کاری دوست داری انجام بده، به آدمایی که دوستشون داری پیام بده و اجازه بده این شادی سرایت کنه.'
            }, {
                title: 'لبخندت رو قشنگ‌تر کن 😁',
                text: 'حال خوب یعنی قدرتمند بودن. از این لحظه لذت ببر، چون لیاقت شادی رو داری. خوشحالی تو یعنی موفقیت تو. امروز رو با یه کار جدید یا یه کار خوش‌حال‌کننده پر کن.'
            }],
            poems: [
                `ارنی کسی بگوید که تورا ندیده باشد
تو که با منی همیشه چه تری چه لن ترانی`,

                `امیدوار چنانم که کار بسته برآید
وصال چون به سر آمد فراق هم به سر آید`,

                `من از تو سیر نگردم و گر ترش کنی ابرو
جواب تلخ ز شیرین مقابل شکر آید`
            ]
        }, {
            id: 4,
            emoji: '🌱',
            label: 'کاش بیشتر حواسش بهم بود',
            badge: 'دلخور',
            messages: [{
                title: 'خودتو فراموش نکن 🌱',

            }, {

        }, {
            id: 6,

            }, {
                title: 'مهربانی بی‌نهایت ♾️',
                text: 'حال خوب برای همه یعنی عشق بی‌نهایت. تو با این نیت داری دنیا رو متحول میکنی. امروز به هر کسی رسیدی، لبخند بزن و یه انرژی مثبت بهش هدیه کن. مطمئن باش این انرژی به خودت برمی‌گرده.'

                text: 'دنیا با مهربانی تو قشنگ‌تر میشه. وقتی برای دیگران آرزوی خوشبختی میکنی، خودت هم تو اون شریک میشی. امروز یه کار خوب برای یه غریبه انجام بده و ببین چقدر دلت آروم می‌گیره.'

            poems: [
                `به لبخندت بساز این دنیا را
که مهربانی کنی فردا را`,

                `دل غمگین مکن از حال کسی
که روزی حال تو را خواهد ساخت`,

                `هر آنکس که به فکر دگر باشد

            ]

        // ============================================================
        //  رفرنس‌ها
        // ============================================================
        const grid = document.getElementById('moodGrid');
        const messageArea = document.getElementById('messageArea');
        const emptyState = document.getElementById('emptyState');
        const responseContainer = document.getElementById('responseContainer');
        const resetBtn = document.getElementById('resetBtn');

        // ============================================================
        //  نگهداری آخرین اندیس برای پیام‌ها و اشعار (جداگانه)
        // ============================================================
        const lastMsgIndexMap = {};
        const lastPoemIndexMap = {};

        // ============================================================
        //  توابع انتخاب غیر تکراری (چرخشی)
        // ============================================================
        function getNextIndex(lastMap, id, items) {
            const count = items.length;
            if (count === 1) return 0;

            const lastIdx = lastMap[id] ?? -1;
            const available = [];
            for (let i = 0; i < count; i++) {
                if (i !== lastIdx) available.push(i);
            }
            if (available.length === 0) return 0;

            const randomIdx = available[Math.floor(Math.random() * available.length)];
            lastMap[id] = randomIdx;
            return randomIdx;
        }

        // ============================================================
        //  ساخت کارت‌های حال
        // ============================================================
        function buildMoodCards() {
            grid.innerHTML = '';
            MOODS.forEach(m => {
                const div = document.createElement('div');
                div.className = 'mood-item';
                div.dataset.id = m.id;
                div.innerHTML = `
                        <span class="mood-emoji">${m.emoji}</span>
                        <span class="mood-label">${m.label}</span>
                        <span class="mood-badge">${m.badge}</span>
                    `;
                div.addEventListener('click', () => handleMoodSelect(m.id));
                grid.appendChild(div);
            });
        }

        // ============================================================
        //  انتخاب حالت و نمایش پیام + شعر
        // ============================================================
        function handleMoodSelect(id) {
            // حذف انتخاب قبلی
            document.querySelectorAll('.mood-item').forEach(el => el.classList.remove('selected'));

            // انتخاب جدید
            const target = document.querySelector(`.mood-item[data-id="${id}"]`);
            if (target) target.classList.add('selected');

            // پیدا کردن داده‌های mood
            const mood = MOODS.find(m => m.id === id);
            if (!mood) return;

            // گرفتن پیام غیر تکراری
            const msgIndex = getNextIndex(lastMsgIndexMap, id, mood.messages);
            const message = mood.messages[msgIndex];

            // گرفتن شعر غیر تکراری
            const poemIndex = getNextIndex(lastPoemIndexMap, id, mood.poems);
            const poem = mood.poems[poemIndex];

            // نمایش
            showMessageAndPoem(mood, message, poem);

            // نمایش دکمه تغییر
            resetBtn.style.display = 'inline-flex';

            // اسکرول به پیام
            setTimeout(() => {
                messageArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 200);
        }

        // ============================================================
        //  نمایش پیام و شعر
        // ============================================================
        function showMessageAndPoem(mood, message, poem) {
            emptyState.style.display = 'none';
            responseContainer.style.display = 'block';

            // تبدیل شعر به خط‌های جداگانه با <br>
            const poemLines = poem.split('\n').filter(line => line.trim() !== '');
            const poemHtml = poemLines.map(line =>
                `<span class="poem-verse">${line}</span>`
            ).join('');

            responseContainer.innerHTML = `
                    <div class="response-message">
                        <span class="msg-emoji">${mood.emoji}</span>
                        <div class="msg-title">${message.title}</div>
                        <div class="msg-text">${message.text}</div>

                        <div class="poem-section">
                            <div class="poem-label">
                                <i class="fas fa-feather-alt"></i>
                                شعری برای حال تو
                                <i class="fas fa-feather-alt"></i>
                            </div>
                            <div class="poem-content">
                                ${poemHtml}
                            </div>
                        </div>

                        <div class="msg-footer">
                            <i class="fas fa-smile-beam" style="color:#e8a87c;"></i>
                            این پیام و شعر مخصوص توست، امیدوارم حالت رو بهتر کنه
                        </div>
                    </div>
                `;
        }

        // ============================================================
        //  ریست / انتخاب مجدد
        // ============================================================
        function resetSelection() {
            document.querySelectorAll('.mood-item').forEach(el => el.classList.remove('selected'));
            responseContainer.style.display = 'none';
            emptyState.style.display = 'block';
            resetBtn.style.display = 'none';

            grid.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // ============================================================
        //  منوی فعال
        // ============================================================
        function setActiveNavItem() {
            document.querySelectorAll('.nav-links a').forEach(el => el.classList.remove('active'));
            const navMood = document.getElementById('navMood');
            if (navMood) navMood.classList.add('active');
        }

        // ============================================================
        //  راه‌اندازی
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            setActiveNavItem();
            buildMoodCards();

            resetBtn.addEventListener('click', resetSelection);
        });
    </script>
