<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تایید کد</title>

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #cfebdd;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #cfebdd;
            padding: 40px;
            border-radius: 40px;
            box-shadow: 10px 10px 25px #b0c7b9, -10px -10px 25px #eefff1;
            width: 350px;
            text-align: center;
        }

        .input {
            width: 100%;
            padding: 15px;
            border-radius: 30px;
            border: none;
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
            box-shadow: inset 5px 5px 10px #b0c7b9, inset -5px -5px 10px #eefff1;
        }

        .btn {
            margin-top: 20px;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 30px;
            background: #2c5a44;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

            .btn:active {
                transform: scale(0.98);
            }
    </style>
</head>

<body>

    <div class="card">
        <h2>تایید کد پیامک</h2>

        <form id="otpForm">
            <input type="text" id="otp" class="input" placeholder="کد ۶ رقمی" maxlength="6">

            <button type="submit" class="btn" id="submitBtn">
                تایید و ورود
            </button>
        </form>
    </div>

    <script>

        const API_BASE_URL = "";

        // گرفتن شماره از صفحه قبل
        const phone = sessionStorage.getItem("phone");
        const name = sessionStorage.getItem("name");

        if (!phone) {
            alert("شماره یافت نشد، دوباره ثبت نام کنید");
            window.location.href = "Login.html";
        }

        document.getElementById("otpForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const otp = document.getElementById("otp").value.trim();

            if (otp.length !== 6) {
                alert("کد باید ۶ رقمی باشد");
                return;
            }

            await verifyOtp(phone, otp , name);
        });

        async function verifyOtp(phone, otp , name) {
            const btn = document.getElementById("submitBtn");
            btn.disabled = true;
            btn.innerText = "در حال بررسی...";

            try {
                console.log("1. شروع درخواست به سرور...");

                const response = await fetch(`${API_BASE_URL}/api/Users/SignInOtp/`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        mobileNumber: phone,
                        otpCode: otp,
                        name : name
                    })
                });

                console.log("2. پاسخ دریافت شد:", response.status, response.statusText);
                console.log("3. response.ok =", response.ok);

                // مهم: ابتدا محتوای پاسخ را لاگ کنید
                const text = await response.text();
                console.log("4. محتوای خام پاسخ:", text);

                // حالا تبدیل به JSON کنید
                const result = JSON.parse(text);
                console.log("5. نتیجه JSON:", result);

                if (response.ok) {
                    console.log("6. ورود موفق!");
                    sessionStorage.removeItem("phone"); 
                    window.location.href = "Dashboard.html"; 
                    return;
                }

            } catch (err) {
                console.error("❌ خطا در catch:", err);
                console.error("پیام خطا:", err.message);
                alert("خطا در ارتباط با سرور");
            } finally {
                btn.disabled = false;
                btn.innerText = "تایید و ورود";
            }
        }

    </script>

</body>
</html>
