<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرم ثبت نام لبخند - Cinematic</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            direction: rtl;
            overflow: auto;
            background: linear-gradient(135deg, #fdd6e0, #d0f0f5, #f8d6e0, #d0f7f5);
            background-size: 600% 600%;
            animation: gradientBG 30s ease infinite;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        /* SHAPES */
        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.15;
            pointer-events: none;
            transition: transform 0.2s ease;
            z-index: 0;
        }

        .shape1 {
            width: 280px;
            height: 280px;
            background: #f78ca0;
            left: 5%;
            top: 10%;
        }

        .shape2 {
            width: 200px;
            height: 200px;
            background: #40c0c0;
            left: 55%;
            top: 25%;
        }

        .shape3 {
            width: 140px;
            height: 140px;
            background: #8a2be2;
            left: 80%;
            top: 20%;
        }

        .shape4 {
            width: 220px;
            height: 220px;
            background: #ffb6c1;
            left: 25%;
            top: 55%;
        }

        .shape5 {
            width: 170px;
            height: 170px;
            background: #20b2aa;
            left: 65%;
            top: 60%;
        }

        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* FORM */
        form {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 45px 35px;
            border-radius: 30px;
            width: 350px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
            transition: transform 0.3s ease;
        }

            form:hover {
                transform: translateY(-3px);
            }

            /* H1 */
            form h1 {
                font-family: 'Poppins', sans-serif;
                font-size: 32px;
                font-weight: 600;
                margin-bottom: 10px;
                color: #333;
                transition: all 0.3s ease;
            }

                form h1:hover {
                    color: #f78ca0;
                    transform: scale(1.05);
                }

                form h1::after {
                    content: '';
                    display: block;
                    width: 70px;
                    height: 4px;
                    background: linear-gradient(90deg,#f78ca0,#40c0c0,#ffb6c1);
                    margin: 6px auto 15px;
                    border-radius: 2px;
                    transition: all 0.3s ease;
                }

                form h1:hover::after {
                    width: 100px;
                }

            /* پاراگراف زیر h1 با افکت hover */
            form p {
                font-size: 15px;
                color: #555;
                margin-bottom: 30px;
                transition: transform 0.3s ease, color 0.3s ease;
            }

                form p:hover {
                    transform: translateY(-2px);
                    color: #40c0c0;
                }

        .input-group {
            margin-bottom: 20px;
        }

            .input-group input {
                width: 100%;
                padding: 14px 18px;
                border-radius: 25px;
                border: 1px solid #ccc;
                background-color: #fafafa;
                font-size: 14px;
            }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(135deg,#f78ca0,#40c0c0,#ffb6c1);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }

        footer {
            margin-top: 20px;
            font-size: 13px;
            color: #8a2be2;
            text-align: center;
        }

            footer span.tara {
                color: #f78ca0;
            }

            footer span.mohammad {
                color: #40c0c0;
            }

            footer span.rest {
                color: #8a2be2;
            }

        #message-box {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: 500;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 10;
        }

            #message-box.show {
                opacity: 1;
            }

        @media (max-width:400px) {
            form {
                width: 90%;
                padding: 35px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>
    <div class="shape shape4"></div>
    <div class="shape shape5"></div>
    <canvas id="particles"></canvas>

    <div class="container">

        <form id="signup-form">
            <h1>لبخند</h1>
            <p>با لبخند هرروز پیام های امیدوار کننده برای شما ارسال میشه</p>

            <div class="input-group">
                <input type="text" id="firstName" name="firstName" placeholder="نام" required>
            </div>

            <div class="input-group">
                <input type="text" id="lastName" name="lastName" placeholder="نام خانوادگی" required>
            </div>

            <div class="input-group">
                <input type="tel" id="mobile" name="mobile" placeholder="09120000000" pattern="[0-9]{10,15}" required>
            </div>

            <button type="submit">ثبت نام</button>
        </form>

        <footer>
            <span class="rest">CREATED BY </span>
            <span class="tara">Tara</span> &
            <span class="mohammad">Mohammad</span>
        </footer>

    </div>

    <div id="message-box"></div>

    <script>
        // اینجا می‌تونی اسکریپت particles و فرم قبلی رو بذاری
    </script>

</body>
</html>
