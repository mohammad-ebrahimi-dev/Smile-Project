<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>لبخند</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', 'Inter', sans-serif;
            min-height: 100vh;
            background: #cfebdd;
            overflow-x: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
        }

        .bubble {
            position: absolute;
            background: radial-gradient(circle at 30% 30%, rgba(70, 130, 100, 0.25), rgba(46, 90, 67, 0.05));
            border-radius: 50%;
            pointer-events: none;
            animation: float linear infinite;
            z-index: 0;
            filter: blur(1px);
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0.3);
                opacity: 0;
            }
            20% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-20vh) scale(1.2);
                opacity: 0;
            }
        }

        .hero {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 1100px;
            text-align: center;
            perspective: 1200px;
            padding: 1rem 0;
        }

        .neumorph-card {
            background: #cfebdd;
            border-radius: 80px;
            padding: 3rem 2rem;
            box-shadow: 20px 20px 35px #b0c7b9, -20px -20px 35px #eefff1;
            transition: transform 0.2s ease-out, box-shadow 0.3s;
            transform-style: preserve-3d;
            border: none;
        }

        .floating-title {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 900;
            background: linear-gradient(135deg, #2c5a44, #1f784c, #e8a87c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -2px;
            margin-bottom: 1rem;
            animation: textFloat 4s ease-in-out infinite;
        }

        @keyframes textFloat {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        .wave-line {
            width: 180px;
            height: 4px;
            background: linear-gradient(90deg, #2c5a44, #e8a87c, #5fbb9b);
            margin: 0 auto 1.5rem;
            border-radius: 4px;
            animation: waveWidth 3s ease-in-out infinite alternate;
        }

        @keyframes waveWidth {
            0% {
                width: 120px;
                opacity: 0.6;
            }
            100% {
                width: 220px;
                opacity: 1;
            }
        }

        .inspire-text {
            font-size: 1.2rem;
            font-weight: 500;
            color: #2c5a44;
            background: #cfebdd;
            display: inline-block;
            padding: 0.6rem 1.8rem;
            border-radius: 60px;
            margin: 1rem 0 2rem;
            border-left: 2px solid #e8a87c;
            border-right: 2px solid #e8a87c;
            direction: ltr;
            font-family: 'Vazirmatn', 'Inter', monospace;
            box-shadow: inset 3px 3px 8px #b0c7b9, inset -3px -3px 8px #eefff1;
        }

        .typed-cursor {
            color: #e8a87c;
            font-weight: 300;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            from,
            to {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        .icon-grid {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 2.5rem 0 1rem;
            flex-wrap: wrap;
        }

        .icon-item {
            background: #cfebdd;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #2c5a44;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            cursor: pointer;
            animation: floatIcon 3s infinite alternate;
            position: relative;
            box-shadow: 9px 9px 16px #b0c7b9, -9px -9px 16px #eefff1;
            text-decoration: none;
        }

        .icon-item,
        .btn-aura {
            cursor: pointer;
        }

        .icon-item {
            pointer-events: auto;
        }

        .icon-item:hover {
            transform: scale(1.08) translateY(-8px);
            color: #e8a87c;
            box-shadow: 12px 12px 20px #b0c7b9, -12px -12px 20px #eefff1;
        }

        .icon-item:active {
            transform: scale(0.96);
            box-shadow: inset 6px 6px 12px #b0c7b9, inset -6px -6px 12px #eefff1;
            color: #c97e5a;
        }

        .icon-item[data-label]:hover::after {
            content: attr(data-label);
            position: absolute;
            bottom: -45px;
            left: 50%;
            transform: translateX(-50%);
            background: #cfebdd;
            box-shadow: 6px 6px 12px #b0c7b9, -6px -6px 12px #eefff1;
            color: #2c5a44;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 5px 14px;
            border-radius: 40px;
            white-space: nowrap;
            z-index: 20;
            pointer-events: none;
            backdrop-filter: blur(4px);
            font-family: 'Vazirmatn', 'Inter', sans-serif;
        }

        @keyframes floatIcon {
            0% {
                transform: translateY(0px);
            }
            100% {
                transform: translateY(-6px);
            }
        }

        .btn-aura {
            background: #cfebdd;
            border: none;
            padding: 14px 38px;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 700;
            color: #1f4d38;
            transition: all 0.2s ease;
            margin-top: 2rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            box-shadow: 9px 9px 16px #b0c7b9, -9px -9px 16px #eefff1;
            letter-spacing: 0.5px;
            text-decoration: none;
            font-family: 'Vazirmatn', 'Inter', sans-serif;
        }

        .btn-aura:hover {
            transform: translateY(-3px);
            box-shadow: 14px 14px 22px #b0c7b9, -14px -14px 22px #eefff1;
            color: #e8a87c;
            gap: 16px;
        }

        .btn-aura:active {
            box-shadow: inset 6px 6px 12px #b0c7b9, inset -6px -6px 12px #eefff1;
            transform: scale(0.97);
        }

        .toast-message {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #cfebdd;
            box-shadow: 9px 9px 16px #b0c7b9, -9px -9px 16px #eefff1;
            color: #1f4d38;
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 0.9rem;
            z-index: 1000;
            font-weight: 600;
            text-align: center;
            backdrop-filter: blur(4px);
            animation: fadeInUp 0.3s ease-out;
            direction: rtl;
            font-family: 'Vazirmatn', 'Inter', sans-serif;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .sig {
            position: fixed;
            bottom: 18px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.75rem;
            color: #4b6e5b;
            z-index: 20;
            font-weight: 500;
            letter-spacing: 1px;
            background: rgba(207, 235, 221, 0.5);
            backdrop-filter: blur(4px);
            width: fit-content;
            margin: 0 auto;
            padding: 4px 16px;
            border-radius: 60px;
            font-family: 'Vazirmatn', 'Inter', sans-serif;
        }

        @media (max-width: 640px) {
            .neumorph-card {
                padding: 2rem 1.2rem;
            }
            .icon-item {
                width: 65px;
                height: 65px;
                font-size: 1.8rem;
            }
            .inspire-text {
                font-size: 0.9rem;
                padding: 0.4rem 1.2rem;
            }
            .btn-aura {
                padding: 10px 24px;
                font-size: 0.9rem;
            }
            .icon-item[data-label]:hover::after {
                font-size: 0.7rem;
                bottom: -38px;
            }
        }

        .neumorph-card {
            transform-style: preserve-3d;
            will-change: transform;
        }

        .icon-grid,
        .btn-aura {
            position: relative;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div id="bubbleContainer"></div>

    <div class="hero">
        <div class="neumorph-card" id="neumorphCard">
            <h1 class="floating-title">لبخند</h1>
            <div class="wave-line"></div>
            <div class="inspire-text" id="dynamicMessage"></div>
            <div class="icon-grid">
                <a href="/Login.html" class="icon-item" data-label="ثبت نام" id="btnRegister"><i class="fas fa-user-plus"></i></a>
                <a href="/AboutUs.html" class="icon-item" data-label="درباره ما" id="btnAbout"><i class="fas fa-info-circle"></i></a>
                <!--<a href="https://example.com/contact" class="icon-item" data-label="تماس با ما" id="btnContact"><i class="fas fa-envelope"></i></a>-->
                <a href="/Dashboard.html" class="icon-item" data-label="داشبورد" id="btnDashboard"> <i class="fas fa-user-gear"></i>    </a>
            </div>

            <a href="javascript:void(0)" class="btn-aura" id="magicBtn">
                <i class="fas fa-spa"></i> رها کن
            </a>
        </div>
    </div>
    <div class="sig">
        ✦ Created by Tara &amp; Mohammad ✦
    </div>

    <script>
        const bubbleContainer = document.getElementById('bubbleContainer');

        function createBubble() {
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            const size = Math.random() * 90 + 25;
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${Math.random() * 100}%`;
            bubble.style.animationDuration = `${Math.random() * 10 + 7}s`;
            bubble.style.animationDelay = `${Math.random() * 5}s`;
            bubbleContainer.appendChild(bubble);
            setTimeout(() => bubble.remove(), 16000);
        }
        setInterval(createBubble, 700);

        const messages = [
            "لازم نیست همه چیز رو امروز حل کنی",
            "کافیه فقط یه قدم کوچیک برداری",
            "قرار نیست کامل باشی تا حال خوبی داشته باشی",
            "بعضی روزها فقط ادامه دادن خودش موفقیته",
            "آروم‌تر رفتن همیشه یعنی عقب موندن نیست",
            "تو از چیزی که فکر می‌کنی جلوتر هستی",
            "همه چیز لازم نیست معنی داشته باشه تا خوب باشه",
            "یه کم مکث کن دنیا بدون تو هم ادامه پیدا می‌کنه",
            "حواست باشه نفس کشیدن هم یه دستاورد حساب میشه",
            "زندگی قرار نیست همیشه جدی گرفته بشه"
        ];
        let msgIndex = 0;
        const typedEl = document.getElementById('dynamicMessage');
        let currentText = "";
        let isDeleting = false;

        function typeEffect() {
            const fullText = messages[msgIndex];
            if (isDeleting) {
                currentText = fullText.substring(0, currentText.length - 1);
            } else {
                currentText = fullText.substring(0, currentText.length + 1);
            }
            typedEl.innerHTML = `${currentText}<span class="typed-cursor">|</span>`;
            if (!isDeleting && currentText === fullText) {
                isDeleting = true;
                setTimeout(typeEffect, 2200);
            } else if (isDeleting && currentText === "") {
                isDeleting = false;
                msgIndex = (msgIndex + 1) % messages.length;
                setTimeout(typeEffect, 280);
            } else {
                let speed = isDeleting ? 45 : 85;
                setTimeout(typeEffect, speed);
            }
        }
        typeEffect();

        const card = document.getElementById('neumorphCard');
        let ticking = false;

        document.addEventListener('mousemove', (e) => {
            if (!ticking) {
                requestAnimationFrame(() => {
                    const xAxis = (window.innerWidth / 2 - e.pageX) / 40;
                    const yAxis = (window.innerHeight / 2 - e.pageY) / 40;
                    card.style.transform = `rotateY(${xAxis}deg) rotateX(${-yAxis}deg) translateZ(5px)`;
                    ticking = false;
                });
                ticking = true;
            }
        });

        document.body.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateY(0deg) rotateX(0deg)';
        });

        const sampleLinks = ['btnContact', 'btnDashboard'];
        sampleLinks.forEach(linkId => {
            const link = document.getElementById(linkId);
            if (link && link.href.includes('example.com')) {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    showToast('🔗 این لینک نمایشی است. در نسخه نهایی مسیر واقعی قرار خواهد گرفت.');
                });
            }
        });

        function showToast(message) {
            const existingToast = document.querySelector('.toast-message');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'fadeInUp 0.3s ease-out reverse';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        const magicBtn = document.getElementById('magicBtn');
        if (magicBtn) {
            magicBtn.addEventListener('click', (e) => {
                e.preventDefault();

                const happyMessages = [
                    "🌿 همین لحظه کافیه… لازم نیست عجله کنی، فقط باش",
                    "☀️ امروز قرار نیست کامل باشی، فقط کافیه ادامه بدی",
                    "💛 یه نفس آروم… همین الانش هم همه چیز بد نیست",
                    "🌙 بعضی روزها فقط باید سبک‌تر زندگی کرد، نه سخت‌تر.",
                    "🍃 ذهنت رو کمی خلوت کن… همه چیز ساده‌تر از چیزی هست که فکر می‌کنی",
                    "✨ قرار نیست همه چیز رو حل کنی؛ بعضی چیزها خودشون حل میشن",
                    "🌸 یه لبخند کوچیک هم می‌تونه حال یه روز رو عوض کنه",
                    "🫧 آرامش از جایی شروع میشه که با خودت مهربون‌تر میشی",
                    "🌼 امروز رو لازم نیست بسازی… فقط تجربه‌ش کن",
                    "💫 هیچ چیز برای همیشه سخت نمی‌مونه، حتی همین لحظه"
                ];

                const randomMessage = happyMessages[Math.floor(Math.random() * happyMessages.length)];
                showToast(randomMessage);
            });
        }

        const realLinks = ['btnRegister', 'btnAbout'];
        realLinks.forEach(linkId => {
            const link = document.getElementById(linkId);
            if (link && !link.href.includes('example.com')) {
                link.addEventListener('click', (e) => {
                    console.log(`Navigating to: ${link.href}`);
                });
            }
        });
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const res = await fetch("/api/Board");
                if (!res.ok) return;

                const data = await res.text();

                if (!data || data.trim() === "") return;

                showBanner(data);

            } catch (err) {
                console.log("Board API error:", err);
            }
        });
        function showBanner(message) {
            // اگر قبلاً بنر وجود داشت حذفش کن
            const old = document.getElementById("boardBanner");
            if (old) old.remove();

            const banner = document.createElement("div");
            banner.id = "boardBanner";
            banner.textContent = message;

            banner.style.position = "fixed";
            banner.style.top = "20px";
            banner.style.left = "50%";
            banner.style.transform = "translateX(-50%)";
            banner.style.background = "#2c5a44";
            banner.style.color = "#fff";
            banner.style.padding = "12px 24px";
            banner.style.borderRadius = "40px";
            banner.style.boxShadow = "0 10px 25px rgba(0,0,0,0.2)";
            banner.style.zIndex = "9999";
            banner.style.fontWeight = "600";

            document.body.appendChild(banner);

            // اتومات حذف بعد چند ثانیه
            setTimeout(() => {
                banner.remove();
            }, 5000);
        }

    </script>
</body>
</html>
