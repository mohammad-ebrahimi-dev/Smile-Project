<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام و ورود</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 300px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

            button:hover {
                background: #0056b3;
            }

        h2 {
            text-align: center;
        }

        #message {
            color: red;
            text-align: center;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>ثبت‌نام</h2>
        <div id="message"></div>
        <form id="registerForm">
            <input type="text" id="firstName" placeholder="نام" required>
            <input type="text" id="lastName" placeholder="نام خانوادگی" required>
            <input type="text" id="mobile" placeholder="شماره موبایل" required>
            <button type="submit">ثبت‌نام</button>
        </form>
        <hr>
        <h2>ورود</h2>
        <form id="loginForm">
            <input type="text" id="loginMobile" placeholder="شماره موبایل" required>
            <button type="submit">ورود</button>
        </form>
    </div>

    <script>
        const API_BASE = "https://localhost44343/api/auth"; // آدرس بک‌اندت رو اینجا بذار

        // ثبت‌نام
        document.getElementById("registerForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            const firstName = document.getElementById("firstName").value;
            const lastName = document.getElementById("lastName").value;
            const mobile = document.getElementById("mobile").value;
            const password = document.getElementById("password").value;

            try {
                const res = await fetch(`${API_BASE}/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ firstName, lastName, mobile, password })
                });
                const data = await res.json();
                document.getElementById("message").innerText = data.message || "ثبت‌نام موفق!";
            } catch (err) {
                document.getElementById("message").innerText = "خطا در ثبت‌نام!";
                console.error(err);
            }
        });

        // ورود
        document.getElementById("loginForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            const mobile = document.getElementById("loginMobile").value;
            const password = document.getElementById("loginPassword").value;

            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ mobile, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem("token", data.token); // ذخیره توکن
                    alert("ورود موفق! می‌توانید به صفحه بعد بروید.");
                    // اینجا می‌تونی کاربر رو به داشبورد هدایت کنی
                } else {
                    document.getElementById("message").innerText = data.message || "شماره موبایل یا رمز عبور اشتباه است!";
                }
            } catch (err) {
                document.getElementById("message").innerText = "خطا در ورود!";
                console.error(err);
            }
        });
    </script>
</body>
</html>
