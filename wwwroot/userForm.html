<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرم ثبت نام کاربر</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-wrapper {
            background: rgba(255, 255, 255, 0.1);
            padding: 35px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            color: #fff;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 26px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 16px;
            transition: 0.3s;
        }

            input:focus {
                box-shadow: 0 0 10px rgba(255,255,255,0.7);
            }

        button {
            width: 100%;
            padding: 12px;
            background: #fff;
            color: #2575fc;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

            button:hover {
                background: #2575fc;
                color: #fff;
            }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="form-wrapper">
        <h2>فرم ثبت نام کاربر</h2>
        <form id="userForm">
            <label for="firstName">نام:</label>
            <input type="text" id="firstName" name="FirstName" required>

            <label for="lastName">نام خانوادگی:</label>
            <input type="text" id="lastName" name="LastName" required>

            <label for="mobile">شماره موبایل:</label>
            <input type="text" id="mobile" name="Mobile" placeholder="مثال: 09123456789" pattern="^09\d{9}$" required>

            <button type="submit">ثبت اطلاعات</button>
        </form>
        <div class="message" id="message"></div>
    </div>

    <script>
        const form = document.getElementById('userForm');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(form);

            try {
                const response = await fetch('https://localhost:44343/api/users', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    messageDiv.textContent = data.message;
                    messageDiv.style.color = '#00ff00';
                    form.reset();
                } else {
                    const errorData = await response.json();
                    messageDiv.textContent = 'خطا: ' + JSON.stringify(errorData);
                    messageDiv.style.color = '#ff5555';
                }
            } catch (error) {
                messageDiv.textContent = 'خطا در اتصال به سرور';
                messageDiv.style.color = '#ff5555';
            }
        });
    </script>
</body>
</html>
